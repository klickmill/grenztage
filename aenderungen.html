<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Was sich an Grenztage geändert hat, Version für Version.">
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Änderungen · Grenztage</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f6f8; --card:#ffffff; --rand:#e2e5ea; --text:#111827; --leise:#4b5563; --akzent:#be123c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --rand:#272c36; --text:#e8ebf0; --leise:#9aa3af; --akzent:#fda4af; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  main { max-width:680px; margin:0 auto; padding:24px 16px 48px; }
  .zurueck { display:inline-flex; align-items:center; min-height:44px; color:var(--akzent); font-weight:600; }
  h1 { font-size:1.7rem; margin:8px 0 16px; }
  h2 { font-size:1.15rem; margin:28px 0 8px; }
  a { color:var(--akzent); }
  a:focus-visible { outline:2px solid var(--akzent); outline-offset:2px; }
  .kasten { background:var(--card); border:1px solid var(--rand); border-radius:16px; padding:16px 18px; margin:16px 0; }
  .leise { color:var(--leise); }
  ul { padding-left:1.2em; }
  footer { margin-top:40px; text-align:center; color:var(--leise); font-size:.9rem; }
  footer a { color:var(--leise); }
</style>
</head>
<body>
<main>
  <h1>Was sich geändert hat</h1>
  <p><a class="zurueck" href="./">Zurück zu Grenztage</a></p>
  <h2>Version 1.0 (21.10.2026)</h2>
  <ul>
    <li>Erste Fassung: Kalender mit Land und Art je Tag, eigene Grenzen mit Zähler, Tabelle speichern und einspielen.</li>
    <li>Der Quellcode ist offen (MIT): <a href="https://github.com/klickmill/grenztage">github.com/klickmill/grenztage</a>.</li>
  </ul>
</main>
</body>
</html>
